version: v2
clean: true
plugins:
  - remote: buf.build/protocolbuffers/go:v1.36.10
    out: backend/generated
    opt: paths=source_relative
  - remote: buf.build/grpc/go:v1.5.1
    out: backend/generated
    opt: paths=source_relative
  - remote: buf.build/protocolbuffers/js:v3.21.4
    out: frontend/generated
    opt: import_style=commonjs,binary
  - remote: buf.build/grpc/web:v2.0.2
    out: frontend/generated
    opt: import_style=typescript,mode=grpcwebtext
